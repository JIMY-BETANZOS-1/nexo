# NEXO · compilación y pruebas en Windows, Linux (x86_64 y ARM64), macOS, iPhone y Android.
# Cada ejecución deja descargables (Artifacts) y capturas de pantalla de cada sistema.
# Al subir una etiqueta vX.Y.Z se publica además una versión en «Releases» con todos los instaladores.
name: NEXO

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Escritorio · Windows
    runs-on: windows-latest
    defaults: { run: { working-directory: nexo, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: nexo }
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Prueba sin interfaz (no borra nada)
        shell: pwsh
        run: |
          Start-Process target\release\nexo.exe -ArgumentList "--simular-auto","sim.txt" -Wait
          Get-Content sim.txt
          if (-not (Select-String sim.txt -Pattern "videos/documentos incluidos: 0" -Quiet)) { exit 1 }
      - run: cp target/release/nexo.exe NEXO-Windows.exe
      - uses: actions/upload-artifact@v4
        with: { name: NEXO-Windows, path: nexo/NEXO-Windows.exe }

  linux:
    name: Escritorio · Linux (${{ matrix.arq }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { so: ubuntu-22.04, arq: x86_64 }
          - { so: ubuntu-22.04-arm, arq: aarch64 }
    runs-on: ${{ matrix.so }}
    defaults: { run: { working-directory: nexo, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: nexo }
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Prueba sin interfaz (no borra nada)
        run: |
          ./target/release/nexo --informe informe.txt && cat informe.txt
          ./target/release/nexo --diagnostico diag.txt && cat diag.txt
          ./target/release/nexo --simular-auto sim.txt && cat sim.txt
          grep -q "videos/documentos incluidos: 0" sim.txt
      - name: Capturas de la ventana (pantalla virtual)
        if: matrix.arq == 'x86_64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libegl1 libgl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1
          mkdir -p capturas
          for p in panel limpieza ram diagnostico proteccion; do
            NEXO_CAPTURA=$PWD/capturas/linux_$p.bmp NEXO_CAPTURA_SEG=4 timeout 60 xvfb-run -a -s "-screen 0 1600x1000x24" ./target/release/nexo --pagina $p || true
          done
          ls -la capturas
      - name: Paquetes .tar.gz, .deb y AppImage
        run: bash empaquetar/linux.sh
      - name: Probar el paquete .deb instalado
        run: |
          sudo apt-get install -y -qq ./paquetes/*.deb
          nexo --simular-auto sim2.txt && grep -q "videos/documentos incluidos: 0" sim2.txt
      - uses: actions/upload-artifact@v4
        with: { name: "NEXO-Linux-${{ matrix.arq }}", path: nexo/paquetes/* }
      - uses: actions/upload-artifact@v4
        if: matrix.arq == 'x86_64'
        with: { name: capturas-linux, path: nexo/capturas, if-no-files-found: ignore }

  macos:
    name: Escritorio · macOS
    runs-on: macos-latest
    defaults: { run: { working-directory: nexo, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: nexo }
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - name: Compilar para Apple Silicon e Intel (binario universal)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output nexo target/aarch64-apple-darwin/release/nexo target/x86_64-apple-darwin/release/nexo
          lipo -info nexo
      - name: Prueba sin interfaz (no borra nada)
        run: |
          ./nexo --informe informe.txt && cat informe.txt
          ./nexo --diagnostico diag.txt && cat diag.txt
          ./nexo --simular-auto sim.txt && cat sim.txt
          grep -q "videos/documentos incluidos: 0" sim.txt
      - name: Capturas de la ventana
        run: |
          mkdir -p capturas
          for p in panel limpieza ram diagnostico proteccion; do
            NEXO_CAPTURA=$PWD/capturas/macos_$p.bmp NEXO_CAPTURA_SEG=4 ./nexo --pagina $p &
            PID=$!; for i in $(seq 1 40); do kill -0 $PID 2>/dev/null || break; sleep 1; done; kill $PID 2>/dev/null || true
          done
          ls -la capturas
      - name: Crear NEXO.app y el instalador .dmg
        run: |
          ./nexo --exportar-icono icono.png
          mkdir -p NEXO.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icono.png --out NEXO.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) icono.png --out NEXO.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns NEXO.iconset -o NEXO.icns
          mkdir -p dmg/NEXO.app/Contents/MacOS dmg/NEXO.app/Contents/Resources
          cp nexo dmg/NEXO.app/Contents/MacOS/nexo
          cp NEXO.icns dmg/NEXO.app/Contents/Resources/
          cat > dmg/NEXO.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>NEXO</string>
          <key>CFBundleDisplayName</key><string>NEXO</string>
          <key>CFBundleIdentifier</key><string>com.nexo.optimizador</string>
          <key>CFBundleExecutable</key><string>nexo</string>
          <key>CFBundleIconFile</key><string>NEXO</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>VERSION</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed -i '' "s/VERSION/$VER/" dmg/NEXO.app/Contents/Info.plist
          codesign --force --deep --sign - dmg/NEXO.app
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname NEXO -srcfolder dmg -ov -format UDZO NEXO-macOS.dmg
      - uses: actions/upload-artifact@v4
        with: { name: NEXO-macOS, path: nexo/NEXO-macOS.dmg }
      - uses: actions/upload-artifact@v4
        with: { name: capturas-macos, path: nexo/capturas, if-no-files-found: ignore }

  ios:
    name: Móvil · iPhone (iOS)
    runs-on: macos-latest
    defaults: { run: { working-directory: nexo-ios, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - name: Generar el proyecto de Xcode
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Elegir un simulador de iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> $GITHUB_ENV
          echo "Simulador: $UDID"
      - name: Pruebas en el simulador
        run: xcodebuild test -project NEXO.xcodeproj -scheme NEXO -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)" | head -300
      - name: Capturas de cada pantalla en el simulador
        run: |
          xcrun simctl boot "$UDID" || true
          APP=$(find build/Build/Products -name "NEXO.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p capturas
          for t in 0 1 2 3 4; do
            xcrun simctl launch --terminate-running-process "$UDID" com.nexo.movil -pestana $t
            sleep 6
            xcrun simctl io "$UDID" screenshot capturas/ios_pestana_$t.png
          done
      - name: App para iPhone sin firmar (.ipa)
        run: |
          xcodebuild -project NEXO.xcodeproj -scheme NEXO -configuration Release -sdk iphoneos -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          mkdir -p Payload
          cp -R build-dev/Build/Products/Release-iphoneos/NEXO.app Payload/
          zip -qr NEXO-iOS-sin-firmar.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: NEXO-iOS, path: nexo-ios/NEXO-iOS-sin-firmar.ipa }
      - uses: actions/upload-artifact@v4
        with: { name: capturas-ios, path: nexo-ios/capturas, if-no-files-found: ignore }

  android:
    name: Móvil · Android
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nexo-movil, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Llave de firma (secretos del repositorio)
        env: { B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/nexo.jks"
            echo "NEXO_KEYSTORE=$RUNNER_TEMP/nexo.jks" >> "$GITHUB_ENV"
            echo "Se firma con la llave de publicación"
          else
            echo "::warning::Sin los secretos ANDROID_KEYSTORE_*: el APK se firma con una llave de depuración"
          fi
      - name: Compilar el APK
        env: { NEXO_KEYSTORE_PASS: "${{ secrets.ANDROID_KEYSTORE_PASS }}" }
        run: |
          bash gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk NEXO-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: NEXO-Android, path: nexo-movil/NEXO-Android.apk }

  publicar:
    name: Publicar versión (Releases)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, ios, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: NEXO-*, merge-multiple: true, path: descargas }
      - run: ls -la descargas
      - name: Crear la versión con todos los instaladores
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" descargas/* --repo "$GITHUB_REPOSITORY"             --title "NEXO $GITHUB_REF_NAME" --notes-file .github/notas-version.md
