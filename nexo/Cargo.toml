[package]
name = "nexo"
version = "0.1.0"
edition = "2021"
description = "NEXO - limpieza y optimización local para Windows"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.2.9"
walkdir = "2.5.0"

# ── Solo Windows: API Win32, miniaturas del Explorador y notificaciones nativas.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Security"] }

# ── Linux y macOS: llamadas POSIX y miniaturas de imágenes decodificadas por NEXO.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

# ── Linux: ventanas en X11 y en Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

# Binario pequeño y rápido: menos RAM y arranque instantáneo.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
